name: deploy-prod.yml
on:
  push:
    tags:
      - '*'
jobs:
  create-change-sets-and-deploy:
    permissions:
      id-token: write
      contents: read
      issues: write
    env:
      PYTHON_VERSION: 3.12
      ARTIFACTS_BUCKET: ${{ secrets.ARTIFACTS_BUCKET }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install AWS CDK
        run: npm install -g aws-cdk

      - name: Install Pipenv and Dependencies
        run: |
          python -m pip install --upgrade pipenv==2026.0.3 wheel
          pipenv install --deploy --dev

      - id: get_approvers
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          result-encoding: json
          script: |
            const collaborators = await github.paginate(
              github.rest.repos.listCollaborators,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                affiliation: 'direct',
                per_page: 100
              }
            );
            const maintainers = collaborators.filter(c => c.permissions.maintain).map(c => c.login);
            return maintainers;

      - name: Configure Prod deployment credentials
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ secrets.PROD_DEPLOYMENT_ROLE }}
          aws-region: 'us-east-1'

      - name: Download GitHub MCP Server binary from S3
        run: |
          S3_KEY=$(python -c "import json; print(json.load(open('agents/github/mcp-server.json'))['s3_key'])")
          EXPECTED_SHA=$(python -c "import json; print(json.load(open('agents/github/mcp-server.json'))['sha256'])")
          mkdir -p agents/github/lambda/bin
          aws s3 cp "s3://${ARTIFACTS_BUCKET}/${S3_KEY}" agents/github/lambda/bin/github-mcp-server
          ACTUAL_SHA=$(sha256sum agents/github/lambda/bin/github-mcp-server | awk '{print $1}')
          if [ "${ACTUAL_SHA}" != "${EXPECTED_SHA}" ]; then
            echo "FATAL: SHA256 mismatch! Expected ${EXPECTED_SHA}, got ${ACTUAL_SHA}"
            exit 1
          fi
          chmod +x agents/github/lambda/bin/github-mcp-server
          ls -lh agents/github/lambda/bin/github-mcp-server

      - name: Create Production change-set for approval
        id: prod_stack_diff
        env:
          METRICS_CROSS_ACCOUNT_ROLE_ARN: ${{ secrets.METRICS_CROSS_ACCOUNT_ROLE }}
          SECURITY_ADVISORIES_CROSS_ACCOUNT_ROLE_ARN: ${{ secrets.SECURITY_ADVISORIES_CROSS_ACCOUNT_ROLE }}
        run: |
          cp deployment/prod.env .env
          pipenv run cdk diff -c ENVIRONMENT=prod | sed -E 's/[0-9]{12}/[MASKED]/g' > prod_diff.txt

          DIFF_SIZE=$(wc -c < prod_diff.txt)
          if [ $DIFF_SIZE -gt 40000 ]; then
            echo "diff_summary=Large changeset detected (${DIFF_SIZE} bytes). Full diff available in workflow artifacts." >> $GITHUB_OUTPUT
          else
            echo "diff_summary<<EOF" >> $GITHUB_OUTPUT
            cat prod_diff.txt >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Upload production diff as artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: production-stack-diff
          path: prod_diff.txt
          retention-days: 30

      - name: Get version from pyproject.toml
        id: get_version
        run: echo "version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")" >> $GITHUB_OUTPUT

      - name: Approve or Deny Production change set
        uses: trstringer/manual-approval@74d99dff7380e3e4b122d4ededcbca2b6ce59367 # v1
        with:
          secret: ${{ secrets.GITHUB_TOKEN }}
          approvers: ${{ join(fromJSON(steps.get_approvers.outputs.result), ', ') }}
          minimum-approvals: 1
          issue-title: 'Request to approve/deny Production OSCAR Stack Deployment'
          issue-body: |
            ## Production Stack Deployment Request

            **Tag:** `${{ github.ref_name }}`
            **Version:** `${{ steps.get_version.outputs.version }}`
            **Workflow Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            <details>
            <summary>Production Stack Changeset Details</summary>

            ```
            ${{ steps.prod_stack_diff.outputs.diff_summary }}
            ```

            📎 **Full diff available in workflow artifacts:** [production-stack-diff](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            </details>

      - name: Deploy Production stacks
        env:
          METRICS_CROSS_ACCOUNT_ROLE_ARN: ${{ secrets.METRICS_CROSS_ACCOUNT_ROLE }}
          SECURITY_ADVISORIES_CROSS_ACCOUNT_ROLE_ARN: ${{ secrets.SECURITY_ADVISORIES_CROSS_ACCOUNT_ROLE }}
        run: |
          cp deployment/prod.env .env
          pipenv run cdk deploy "*" --require-approval=never -c ENVIRONMENT=prod
