name: deploy-beta.yml
on:
  push:
    branches:
      - 'main'
jobs:
  create-change-sets-and-deploy:
    permissions:
      id-token: write
      contents: read
      issues: write
    env:
      PYTHON_VERSION: 3.12
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install AWS CDK
        run: npm install -g aws-cdk

      - name: Install Pipenv and Dependencies
        run: |
          python -m pip install --upgrade pipenv==2026.0.3 wheel
          pipenv install --deploy --dev

      - name: Extract GitHub MCP Server binary
        run: |
          mkdir -p agents/github/lambda/bin
          docker pull --platform linux/amd64 --quiet ghcr.io/github/github-mcp-server:latest
          CONTAINER=$(docker create --platform linux/amd64 ghcr.io/github/github-mcp-server:latest)
          docker cp "$CONTAINER:/server/github-mcp-server" agents/github/lambda/bin/github-mcp-server
          docker rm "$CONTAINER" > /dev/null
          chmod +x agents/github/lambda/bin/github-mcp-server
          ls -lh agents/github/lambda/bin/github-mcp-server

      - id: get_approvers
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          result-encoding: json
          script: |
            const collaborators = await github.paginate(
              github.rest.repos.listCollaborators,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                affiliation: 'direct',
                per_page: 100
              }
            );
            const maintainers = collaborators.filter(c => c.permissions.maintain).map(c => c.login);
            return maintainers;

      - name: Configure beta deployment credentials
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ secrets.BETA_DEPLOYMENT_ROLE }}
          aws-region: 'us-east-1'
      - name: Create beta change-set for approval
        id: beta_stack_diff
        env:
          METRICS_CROSS_ACCOUNT_ROLE_ARN: ${{ secrets.METRICS_CROSS_ACCOUNT_ROLE }}
          SECURITY_ADVISORIES_CROSS_ACCOUNT_ROLE_ARN: ${{ secrets.SECURITY_ADVISORIES_CROSS_ACCOUNT_ROLE }}
        run: |
          cp deployment/beta.env .env
          pipenv run cdk diff -c ENVIRONMENT=dev | sed -E 's/[0-9]{12}/[MASKED]/g' > beta_diff.txt

          DIFF_SIZE=$(wc -c < beta_diff.txt)
          if [ $DIFF_SIZE -gt 40000 ]; then
            echo "diff_summary=Large changeset detected (${DIFF_SIZE} bytes). Full diff available in workflow artifacts." >> $GITHUB_OUTPUT
          else
            echo "diff_summary<<EOF" >> $GITHUB_OUTPUT
            cat beta_diff.txt >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Upload beta diff as artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: beta-stack-diff
          path: beta_diff.txt
          retention-days: 30

      - name: Approve or Deny beta change set
        uses: trstringer/manual-approval@74d99dff7380e3e4b122d4ededcbca2b6ce59367 # v1
        with:
          secret: ${{ secrets.GITHUB_TOKEN }}
          approvers: ${{ join(fromJSON(steps.get_approvers.outputs.result), ', ') }}
          minimum-approvals: 1
          issue-title: 'Request to approve/deny Beta OSCAR Stack Deployment'
          issue-body: |
            ## Beta Stack Deployment Request

            **Workflow Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            <details>
            <summary>Beta Stack Changeset Details</summary>

            ```
            ${{ steps.beta_stack_diff.outputs.diff_summary }}
            ```

            📎 **Full diff available in workflow artifacts:** [beta-stack-diff](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            </details>

      - name: Deploy beta stacks
        env:
          METRICS_CROSS_ACCOUNT_ROLE_ARN: ${{ secrets.METRICS_CROSS_ACCOUNT_ROLE }}
          SECURITY_ADVISORIES_CROSS_ACCOUNT_ROLE_ARN: ${{ secrets.SECURITY_ADVISORIES_CROSS_ACCOUNT_ROLE }}
        run: |
          cp deployment/beta.env .env
          pipenv run cdk deploy "*" --require-approval=never -c ENVIRONMENT=dev
